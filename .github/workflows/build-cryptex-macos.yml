name: Validate (macOS)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install python ripgrep zstd
      - name: Prepare
        run: ./Dopamine-CryptexBootstrap/setup.sh --prepare
      - name: Python compile
        run: python3 -m py_compile Dopamine-CryptexBootstrap/CryptexBootstrap/*.py
      - name: Tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
