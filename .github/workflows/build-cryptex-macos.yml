name: Build Cryptex (macOS, no SBInject)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install dpkg gnupg ldid python ripgrep zstd
      - name: Prepare
        run: ./Dopamine-CryptexBootstrap/setup.sh --prepare
      - name: Build
        run: ./Dopamine-CryptexBootstrap/setup.sh --build
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-build
          path: Dopamine-CryptexBootstrap/CryptexBootstrap/out/
